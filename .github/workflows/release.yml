# On a version tag: build the agent for every platform, test it, and publish the wheels as
# release assets. app/requirements.txt points at those assets, so Connect Cloud installs them.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build and test wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version agent/package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match agent/package.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Check app/requirements.txt is current for this release and uv.lock
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          make requirements WHEEL_BASE_URL="$base"
          if ! git diff --exit-code app/requirements.txt; then
            echo "::error::app/requirements.txt is stale. Run: make requirements WHEEL_BASE_URL=$base"
            exit 1
          fi

      - name: Build and test
        run: make test
      - name: Lint and type-check
        run: make check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels
          path: wheels
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" wheels/*.whl \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
